name: Refresh ELx token

on:
  schedule:
    # 03:00 UTC daily, three hours ahead of the backend's 06:00 UTC scrape.
    # GitHub does not guarantee scheduled runs fire on time — delays of 10-30+
    # minutes are common at peak — and a late refresh means the scrape finds no
    # valid token and silently skips. The token lasts ~24h, so refreshing early
    # costs nothing and buys slack for a delayed or retried run.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: elx-token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: elx_scraper
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Refresh token
        working-directory: elx_scraper
        env:
          ELX_STATE_B64: ${{ secrets.ELX_STATE_B64 }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          BACKEND_URL: https://miturop.org
        run: python scripts/refresh_token.py
